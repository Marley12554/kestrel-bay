[preset.0]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="bay/data/*.json"
exclude_filter="tests/*,README.md"
script_export_mode=0
export_path="../dist/site/index.html"

[preset.0.options]
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/experimental_virtual_keyboard=false
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false

[preset.1]
name="Mac Desktop"
platform="macOS"
runnable=true
export_filter="all_resources"
include_filter="bay/data/*.json"
exclude_filter="tests/*,README.md"
export_path="../dist/desktop/Kestrel Bay-macOS.zip"

[preset.1.options]
binary_format/architecture="universal"
application/name="Kestrel Bay"
application/bundle_identifier="games.kestrelbay.game"
codesign/codesign=1
codesign/identity="-"

[preset.2]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="bay/data/*.json"
exclude_filter="tests/*,README.md"
export_path="../dist/desktop/windows/Kestrel Bay.exe"

[preset.2.options]
binary_format/architecture="x86_64"
binary_format/embed_pck=false
application/modify_resources=false
