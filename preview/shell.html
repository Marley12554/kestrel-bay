<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Midtown Manhattan · Kestrel Bay</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#adbec3;color:#fff;font:16px/1.35 system-ui,sans-serif}#canvas{display:block;width:100%;height:100%;outline:0;touch-action:none}
.panel{position:fixed;background:#14242bee;color:#f4f5f1;border:1px solid #ffffff40;border-radius:10px;box-shadow:0 3px 16px #15242920;padding:12px 16px}
h1{font-size:clamp(18px,2.2vw,27px);margin:0;letter-spacing:-.04em;font-weight:650}.place{top:max(14px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));pointer-events:none}.place small{color:#b6cccd}
.speed{right:max(14px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));width:min(235px,44vw)}label{display:flex;justify-content:space-between;gap:8px;font-size:15px}output{font-variant-numeric:tabular-nums;color:#a7e4cd}input{display:block;width:100%;margin:4px 0 0;accent-color:#9cdec6;height:25px}
.help{left:14px;bottom:max(14px,env(safe-area-inset-bottom));font-size:14px}.touch{display:none}a{color:inherit}footer{position:fixed;right:12px;bottom:max(14px,env(safe-area-inset-bottom));color:white;background:#172a30c9;border-radius:5px;padding:4px 8px;font-size:12px}
#loading{position:fixed;inset:0;display:grid;place-content:center;text-align:center;background:#192d35;color:#fffaec;z-index:3;padding:2rem}#loading[hidden]{display:none}progress{display:block;margin:14px auto;accent-color:#96d3bd}
#pad,#rise{display:none}button{border:1px solid #ffffff55;border-radius:9px;background:#14242be6;color:#fff;font:600 19px system-ui;min-height:44px;min-width:44px;touch-action:none;user-select:none;-webkit-user-select:none}button:active{background:#2b5651}
#body-control{width:100%;margin-top:4px;font-size:14px;min-height:32px;cursor:pointer}kbd{font:inherit;opacity:.75}
@media(pointer:coarse){#body-control{min-height:44px}kbd{display:none}.help{display:none}.place,.speed{padding:8px 12px}.speed label{font-size:14px}#pad,#rise{display:grid;position:fixed;bottom:max(29px,env(safe-area-inset-bottom));gap:3px}#pad{left:max(12px,env(safe-area-inset-left));grid-template-columns:repeat(3,44px)}#rise{right:max(12px,env(safe-area-inset-right))}#pad button:first-child{grid-column:2}#pad button:nth-child(2){grid-column:1}.touch{display:inline}footer{bottom:1px}}
[hidden]{display:none!important}.controls-row{display:flex;gap:5px}.controls-row button{flex:1;white-space:nowrap;font-size:14px;min-height:32px}#body-control{margin:0;width:auto}.controls-row button{flex:1 0 auto;padding:3px 9px}body:not([data-mode="fly"]) #flight-speed,body:not([data-mode="fly"]) #rise,body[data-mode="drive"] #body-control{display:none}#flight-speed{margin-bottom:6px}.speed{width:auto;min-width:142px}body[data-mode="fly"] .speed{width:min(235px,44vw)}body.clean .panel,body.clean footer,body.clean #pad,body.clean #rise{display:none}.clean-hint{background:none;border:0;font-size:13px;color:#d5dad6;min-height:0;min-width:0;padding:0 3px;text-decoration:underline}.speed .controls-row button{color:#f5eee3}.place small{line-height:1.6}
@media(pointer:coarse){.controls-row button{min-height:44px}.speed{min-width:0;max-width:46vw}.controls-row{flex-wrap:wrap}.clean-hint{min-height:24px}}
#sprint,#jump,#turn-controls{display:none}
@media(pointer:coarse){body[data-mode="drive"]:not(.clean) #turn-controls{display:flex;gap:4px;position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(29px,env(safe-area-inset-bottom))}}
@media(pointer:coarse){body[data-mode="walk"]:not(.clean) #sprint{display:block;position:fixed;left:max(12px,env(safe-area-inset-left));bottom:calc(max(29px,env(safe-area-inset-bottom)) + 96px);font-size:15px;padding:0 12px}#sprint[aria-pressed="true"]{background:#31685c;border-color:#a7e4cd}}
@media(pointer:coarse){body[data-mode="walk"]:not(.clean) #jump{display:block;position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(29px,env(safe-area-inset-bottom));padding:0 12px}}
</style></head><body data-mode="walk">
<canvas id="canvas" tabindex="0" aria-label="Midtown Manhattan street preview"></canvas>
<header class="panel place"><h1>Fifth Avenue</h1><small>West 33rd–34th Streets</small></header>
<div class="panel speed"><div id="flight-speed"><label for="speed">Flight speed <output for="speed" id="readout">95 mph</output></label><input id="speed" type="range" min="2" max="272" aria-valuetext="95 mph" value="95" step="1" aria-label="Flight speed in miles per hour"></div><div class="controls-row"><button type="button" id="body-control"><span id="body-action">Freecam</span> <kbd>· F</kbd></button><button id="car-control" hidden><span>Drive</span> <kbd>· E</kbd></button></div></div>
<div class="panel help" id="help">WASD walk · Shift sprint · Space jump · Click to look · H hide HUD</div>
<button type="button" id="sprint" aria-pressed="false">Sprint</button>
<div id="pad" aria-label="Flight movement"><button data-axis="Z" data-dir="-1" aria-label="Forward">↑</button><button data-axis="X" data-dir="-1" aria-label="Left">←</button><button data-axis="Z" data-dir="1" aria-label="Backward">↓</button><button data-axis="X" data-dir="1" aria-label="Right">→</button></div>
<button type="button" id="jump">Jump</button>
<div id="turn-controls" aria-label="Turn signals"><button data-signal="-1" aria-label="Left turn signal">⇦</button><button data-signal="1" aria-label="Right turn signal">⇨</button></div>
<div id="rise"><button data-axis="Y" data-dir="1" aria-label="Ascend">＋</button><button data-axis="Y" data-dir="-1" aria-label="Descend">−</button></div>
<footer><a href="../">Kestrel Bay</a> · <button type="button" class="clean-hint" id="daylight">Day / night</button> · <button type="button" class="clean-hint" id="motion">Camera motion</button> · <button class="clean-hint" id="hide-ui">Hide HUD</button> · <a href="https://www.asg.ed.tum.de/gis/projekte/new-york-city-3d/" target="_blank" rel="noopener">TUM · NYC Open Data</a></footer>
<div id="loading" role="status"><span id="message">Loading Midtown Manhattan…</span><progress id="loadbar"></progress></div>
<script src="$GODOT_URL"></script>
<script>
const canvas=document.getElementById('canvas'), speed=document.getElementById('speed'), output=document.getElementById('readout');
window.midtownReady=false;window.midtownSpeed=95;window.midtownInControls=false;window.midtownLocked=false;
window.midtownX=window.midtownY=window.midtownZ=0;
window.midtownToggleBody=false;
window.midtownInteract=false;window.midtownJump=false;window.midtownToggleDaylight=false;
document.getElementById("daylight").addEventListener("click",()=>{window.midtownToggleDaylight=true;canvas.focus()});
document.getElementById("jump").addEventListener("click",()=>{window.midtownJump=true;canvas.focus()});
window.midtownSignal=0;
for(const button of document.querySelectorAll('[data-signal]')){
  button.addEventListener('click',()=>{window.midtownSignal=Number(button.dataset.signal);canvas.focus()});
}
const sprintButton=document.getElementById('sprint');
function setSprint(value){window.midtownSprint=value;sprintButton.setAttribute('aria-pressed',String(value))}
setSprint(false);
sprintButton.addEventListener('click',()=>setSprint(!window.midtownSprint));
const levels=['Off','Low','Full'];
const motionButton=document.getElementById('motion');
window.midtownMotionLevel=matchMedia('(prefers-reduced-motion: reduce)').matches?0:2;
function updateMotion(){motionButton.textContent='Camera motion · '+levels[window.midtownMotionLevel]}
function cycleMotion(){window.midtownMotionLevel=(window.midtownMotionLevel+2)%3;updateMotion();canvas.focus()}
motionButton.addEventListener('click',cycleMotion);
document.addEventListener('keydown',e=>{if(e.code==='KeyB'&&!e.repeat)cycleMotion()},true);
updateMotion();
const carButton=document.getElementById('car-control');
window.midtownStreetMode=(mode,nearCar)=>{
  document.body.dataset.mode=mode;
  if(mode!=='walk')setSprint(false);
  updateHelp();
  const flying=mode==='fly',driving=mode==='drive';
  document.getElementById('body-action').textContent=flying?'Return to body':'Freecam';
  carButton.hidden=!driving && (!nearCar || flying);
  carButton.querySelector('span').textContent=driving?'Park & exit':'Drive';
  carButton.querySelector('kbd').textContent='· E';
};
function updateHelp(){
  const mode=document.body.dataset.mode;
  const movement=mode==='drive'?'W accelerate · S brake / reverse · A / D steer · ← / → signal · Look to orbit · E at rest to exit':
    mode==='fly'?'WASD fly · Q / E down / up':'WASD walk · Shift sprint · Space jump';
  const mouse=window.midtownLocked?'V unlock mouse':'Click street to capture mouse';
  document.getElementById('help').textContent=movement+' · '+mouse+' · H hide HUD';
}
carButton.addEventListener('click',()=>{window.midtownInteract=true;canvas.focus()});
function toggleHud(){ window.midtownHudHidden=document.body.classList.toggle('clean');canvas.focus() }
document.getElementById('hide-ui').addEventListener('click',toggleHud);
document.addEventListener('keydown',e=>{if(e.code==='KeyH'&&!e.repeat)toggleHud()},true);
canvas.addEventListener('pointerup',()=>{if(document.body.classList.contains('clean') && matchMedia('(pointer:coarse)').matches) toggleHud()});
document.getElementById('body-control').addEventListener('click',()=>{
  window.midtownToggleBody=true;
  canvas.focus();
});
const held=new Map();
function updateMovement(){
  const axes={X:0,Y:0,Z:0};for(const b of held.values())axes[b.dataset.axis]+=Number(b.dataset.dir);
  for(const key of Object.keys(axes))window['midtown'+key]=Math.sign(axes[key]);
}
for(const b of document.querySelectorAll('button[data-axis]')){
  b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);held.set(e.pointerId,b);updateMovement()});
  b.addEventListener('lostpointercapture',e=>{held.delete(e.pointerId);updateMovement()});
}
window.addEventListener('blur',()=>{held.clear();updateMovement();setSprint(false)});
function updateSpeed(){
  const tick=Number(speed.value);
  let mph=tick;
  if(tick>200) mph=600+(tick-200)*25;
  else if(tick>100) mph=100+(tick-100)*5;
  window.midtownSpeed=mph;
  output.textContent=mph.toLocaleString('en-US')+' mph';
  speed.setAttribute('aria-valuetext',output.textContent);
}
speed.addEventListener('input',updateSpeed);
updateSpeed();
speed.addEventListener('focus',()=>{window.midtownInControls=true});
speed.addEventListener('blur',()=>{window.midtownInControls=false});
speed.addEventListener('pointerup',()=>canvas.focus());
window.midtownHudHidden=false;
canvas.addEventListener('pointerdown',event=>{
  if(event.pointerType!=='mouse'||event.button!==0||document.pointerLockElement===canvas)return;
  canvas.focus();
  canvas.requestPointerLock?.()?.catch?.(()=>{});
});
function releaseMouse(){
  if(document.pointerLockElement===canvas)document.exitPointerLock();
}
document.addEventListener('keydown',event=>{
  if(event.code==='KeyV' && document.pointerLockElement===canvas){
    event.preventDefault();
    releaseMouse();
  }
},true);
document.addEventListener('pointerlockchange',()=>{
  window.midtownLocked=document.pointerLockElement===canvas;
  updateHelp();
});
window.addEventListener('blur',releaseMouse);
updateHelp();
const loading=document.getElementById('loading'),message=document.getElementById('message'),bar=document.getElementById('loadbar');
const config=$GODOT_CONFIG;
const engine=new Engine(config);
function failed(reason){loading.hidden=false;message.textContent=String(reason);bar.hidden=true}
canvas.addEventListener('webglcontextlost',()=>failed('Graphics connection lost. Reload to return to Midtown.'));
engine.startGame({canvas,onProgress:(loaded,total)=>{if(total){bar.max=total;bar.value=loaded}}}).then(()=>{
  function ready(){if(window.midtownReady){loading.hidden=true;canvas.focus();performance.mark('midtown-first-view')}else requestAnimationFrame(ready)}
  requestAnimationFrame(ready)
}).catch(failed);
</script></body></html>
