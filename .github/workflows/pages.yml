name: Test and publish game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check Classic
        run: node tests/acceptance.cjs
      - name: Cache Godot editor and Web export template
        id: godot
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin/godot
            ~/.local/share/godot/export_templates/4.7.1.stable/web_nothreads_release.zip
          key: godot-4.7.1-linux64-web-release-v1
      - name: Install verified Godot 4.7.1
        if: steps.godot.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        env:
          RELEASE: https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable
        run: |
          set -eu
          curl --fail --location --retry 3 --silent --show-error "$RELEASE/Godot_v4.7.1-stable_linux.x86_64.zip" -o editor.zip
          echo 'c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  editor.zip' | sha256sum --check
          unzip -q editor.zip
          install -D -m 0755 Godot_v4.7.1-stable_linux.x86_64 ~/.local/bin/godot
          curl --fail --location --retry 3 --silent --show-error "$RELEASE/Godot_v4.7.1-stable_export_templates.tpz" -o templates.zip
          echo '86409db6200b6f8fd3230989c2d2002851f3dd18acf11d7bdbafddf5a0dd0f72  templates.zip' | sha256sum --check
          template_dir=~/.local/share/godot/export_templates/4.7.1.stable
          mkdir -p "$template_dir"
          unzip -j -q templates.zip templates/web_nothreads_release.zip -d "$template_dir"
      - name: Check the native city and export for the browser
        run: |
          export GODOT_BIN="$HOME/.local/bin/godot"
          node scripts/godot.cjs test
          node scripts/build.cjs
      # Pin the optional snow block independently from the classic desktop game.
      - name: Check out the tested Fifth Avenue preview
        uses: actions/checkout@v6
        with:
          ref: 3d15d7df306392953f05d872b3d3f31f48337818
          path: fifth-source
          sparse-checkout: |
            preview
            tests/midtown-block.gd
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Export Fifth Avenue alongside the regular game
        run: |
          set -eu
          destination="$GITHUB_WORKSPACE/dist/site/fifth-avenue"
          mkdir -p "$destination"
          ~/.local/bin/godot --headless --path fifth-source/preview --editor --import --quit
          ~/.local/bin/godot --headless --path fifth-source/preview --script ../tests/midtown-block.gd
          ~/.local/bin/godot --headless --path fifth-source/preview --export-release Web "$destination/index.html"
          test -s "$destination/index.pck" && test -s "$destination/index.wasm"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
