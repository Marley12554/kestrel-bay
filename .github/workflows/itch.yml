name: Release desktop game to itch.io
on:
  push:
    branches: [main]
    paths:
      - 'godot-prototype/**'
      - 'scripts/godot.cjs'
      - 'tests/desktop-export.cjs'
      - '.github/workflows/itch.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Upload tested builds to itch.io
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: itch-desktop
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Cache Godot and desktop templates
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-desktop/Godot.app
            ~/Library/Application Support/Godot/export_templates/4.7.1.stable
          key: desktop-mac-godot-4.7.1-v1
      - name: Install verified Godot and templates
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        env:
          RELEASE: https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable
        run: |
          curl -fsSL --retry 3 "$RELEASE/Godot_v4.7.1-stable_macos.universal.zip" -o editor.zip
          echo '897cb7f9799796c717ae75f31446aed883dc92b1d6c3b33d893cc7843fff2fa9  editor.zip' | shasum -a 256 -c -
          mkdir -p "$HOME/godot-desktop"
          unzip -q editor.zip -d "$HOME/godot-desktop"
          curl -fsSL --retry 3 "$RELEASE/Godot_v4.7.1-stable_export_templates.tpz" -o templates.zip
          echo '86409db6200b6f8fd3230989c2d2002851f3dd18acf11d7bdbafddf5a0dd0f72  templates.zip' | shasum -a 256 -c -
          templates="$HOME/Library/Application Support/Godot/export_templates/4.7.1.stable"
          mkdir -p "$templates"
          unzip -jq templates.zip templates/macos.zip 'templates/windows_release_x86_64*.exe' -d "$templates"
      - name: Export both platforms and check the Mac package
        run: |
          export GODOT_BIN="$HOME/godot-desktop/Godot.app/Contents/MacOS/Godot"
          node scripts/godot.cjs desktop
          unzip -q 'dist/desktop/Kestrel Bay-macOS.zip' -d "$RUNNER_TEMP/mac"
          app="$RUNNER_TEMP/mac/Kestrel Bay.app"
          codesign --verify --deep --strict "$app"
          architectures=$(lipo -archs "$app/Contents/MacOS/Kestrel Bay")
          grep -qw arm64 <<< "$architectures"
          grep -qw x86_64 <<< "$architectures"
          node tests/desktop-export.cjs "$app/Contents/MacOS/Kestrel Bay"
          cd dist/desktop/windows
          zip -q '../Kestrel Bay-Windows.zip' ./*
      - uses: actions/upload-artifact@v4
        with:
          name: kestrel-bay-desktop
          path: dist/desktop/*.zip
          if-no-files-found: error
          retention-days: 7
  windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: kestrel-bay-desktop
          path: packages
      - name: Start the exported game on Windows
        run: |
          Expand-Archive 'packages/Kestrel Bay-Windows.zip' -DestinationPath game
          node tests/desktop-export.cjs 'game/Kestrel Bay.exe'
  publish:
    needs: windows
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kestrel-bay-desktop
      - name: Install verified itch uploader
        run: |
          curl -fsSL --retry 3 https://broth.itch.zone/butler/linux-amd64/15.32.0/archive/default -o "$RUNNER_TEMP/butler.zip"
          echo "2335971394ef6596f95ded0833e85ee28755e13761716ef4c91d6b11f69162f5  $RUNNER_TEMP/butler.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/butler.zip" -d "$RUNNER_TEMP/itch"
          chmod +x "$RUNNER_TEMP/itch/butler"
          "$RUNNER_TEMP/itch/butler" version
      - name: Publish patchable Mac and Windows channels
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -z "$BUTLER_API_KEY" ]]; then
            echo '::error::Add the BUTLER_API_KEY Actions secret and rerun this job.'
            exit 1
          fi
          if [[ "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)" != "$GITHUB_SHA" ]]; then
            echo 'A newer commit is on main. Release the current main revision.'
            exit 1
          fi
          version="build-$GITHUB_RUN_NUMBER-${GITHUB_SHA:0:7}"
          uploader="$RUNNER_TEMP/itch/butler"
          "$uploader" push 'Kestrel Bay-macOS.zip' marley12554/kestrel-bay:osx --userversion "$version"
          "$uploader" push 'Kestrel Bay-Windows.zip' marley12554/kestrel-bay:windows --userversion "$version"
          "$uploader" status marley12554/kestrel-bay
